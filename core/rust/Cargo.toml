[package]
name = "pg-prism-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
cidr = { version = "0.2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
memchr = "2.5"
