# PG-Prism Guardian rules. First match wins.
#
# Guardian is a guard rail, not an authorisation boundary. Use roles and REVOKE
# for anything that must actually hold.
#
# How matching works
# ------------------
# block_queries and block_tables are matched as whole tokens against the raw
# statement text, ignoring ASCII case. A token boundary is any byte that cannot
# appear in an SQL identifier. So a rule for "secrets" matches SECRETS and
# public.secrets, but not secrets_backup or mysecrets.
#
# Known limitations, all of them deliberate:
#
#   * Only Query and Parse messages under 1 KB are inspected. Padding a
#     statement past that skips every rule here. Raising the threshold only
#     moves the number.
#   * Case folding is ASCII-only. A rule for "müşteri" will not match "MÜŞTERI".
#   * A keyword inside a comment or a string literal still matches, because
#     Guardian searches the raw statement rather than parsing SQL. It errs
#     towards blocking.
#   * Conversely, a double-quoted identifier is case-sensitive in PostgreSQL, so
#     "SECRETS" is a different table from secrets. Guardian blocks it anyway.
#   * A client can always reach a blocked table through a view, a function, or a
#     prepared statement bound after the Parse was inspected.

rules:
  # Trusted operator connections bypass query inspection entirely.
  #
  # Note that this rule is only as trustworthy as the address it is given. The
  # address comes from the PROXY header, which is why TRUSTED_PROXIES must list
  # only load balancers you operate.
  - name: "Admin_Full_Access"
    action: "ALLOW"
    ips: ["127.0.0.1/32", "::1/128"]
    users: ["postgres"]

  # Everything else. `ips` is omitted deliberately: that means "any address, of
  # either family". Writing 0.0.0.0/0 here would look like a catch-all but is
  # the IPv4 default route, so IPv6 clients would match no rule at all and be
  # filtered by nothing.
  - name: "Block_Dangerous_Queries"
    action: "INSPECT"
    block_queries: ["DROP", "TRUNCATE"]
    block_tables: ["secrets"]
